/* Abhakmodus: bewusst reduzierter erster Bildschirm */
.focus-shell{max-width:890px;margin:0 auto;padding-top:clamp(7px,2vh,25px)}
.focus-head{text-align:center;margin:12px auto 20px}.focus-head h2{font-size:clamp(25px,4vw,37px);letter-spacing:-.9px;margin:4px 0 7px}.focus-head p{margin:0;color:var(--muted);font-size:13px}
.focus-kicker{font-size:11px;font-weight:800;letter-spacing:1.5px;color:var(--accent)}
.focus-area-bar{display:flex;gap:8px;justify-content:center;max-width:480px;margin:0 auto 24px;padding:5px;border:1px solid var(--line);background:var(--panel);border-radius:13px}
.focus-area{border:0;border-radius:9px;background:transparent;color:var(--muted);flex:1;min-height:42px;font-weight:700}.focus-area.selected{background:var(--accent);color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.11)}.focus-area:not(.selected):hover{background:var(--panel2);color:var(--text)}
.focus-card{border:1px solid var(--line);border-radius:17px;overflow:hidden;background:var(--panel);box-shadow:0 7px 35px rgba(33,54,79,.045)}
.focus-overline{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;padding:16px 27px;border-bottom:1px solid var(--line);font-size:11px;letter-spacing:.35px;font-weight:730;color:var(--muted)}
.focus-task{padding:31px 30px 29px}.focus-metas{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:18px}.focus-date{font-size:12px;color:var(--muted)}.focus-date.overdue{color:var(--red);font-weight:700}
.focus-task h2{font-size:clamp(24px,4vw,36px);font-weight:750;line-height:1.23;letter-spacing:-.6px;overflow-wrap:anywhere;margin:0 0 14px}.focus-project{font-size:14px;color:var(--muted);margin:0}.focus-description{font-size:14px;line-height:1.6;margin:17px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}.focus-progress{margin-top:18px;max-width:330px}
.focus-actions{display:grid;grid-template-columns:1.2fr 1fr;gap:12px;margin:0 28px 22px}.focus-actions .btn{height:57px;font-size:16px;border-radius:11px}.focus-done{font-weight:750}.focus-skip{background:var(--panel2)}
.focus-details{border-top:1px solid var(--line)}.focus-details summary{list-style:none;cursor:pointer;padding:13px 28px;font-size:12px;font-weight:700;color:var(--muted);display:flex;justify-content:space-between}.focus-details summary::-webkit-details-marker{display:none}.focus-details[open] summary span{transform:rotate(180deg)}.focus-details summary:hover{background:var(--panel2)}.focus-detailbody{padding:4px 28px 20px;border-top:1px solid var(--line)}.focus-detailrow{display:flex;justify-content:space-between;gap:15px;padding:8px 0;font-size:12px;border-bottom:1px solid var(--line)}.focus-detailrow span{color:var(--muted)}.focus-detailbody .row{margin-top:16px}.focus-note{padding:11px 0;font-size:12px}.focus-note p{white-space:pre-wrap;overflow-wrap:anywhere;margin:6px 0}
.focus-bottom{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:7px;padding:18px 4px 10px;color:var(--muted);font-size:12px}.focus-rule{font-size:11px;color:var(--muted);margin:10px 4px;line-height:1.6}
.focus-empty{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:54px 25px;text-align:center}.focus-empty h2{font-size:24px;margin:8px 0}.focus-empty p{max-width:530px;margin:10px auto 23px;color:var(--muted)}.focus-check{font-size:37px;color:var(--accent)}
.area-label{padding:2px 7px;border-radius:5px;border:1px solid var(--line);font-size:11px;color:var(--muted);font-weight:700}.area-group-heading{font-size:13px;letter-spacing:.35px;font-weight:760;color:var(--muted);padding:17px 3px 10px;margin-top:4px;border-bottom:1px solid var(--line);margin-bottom:12px}

/* Neuprüfung / Inbox */
.inbox-hero{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:21px;margin-bottom:18px}
.inbox-hero h2{font-size:23px;margin:3px 0 7px}.inbox-hero p{margin:0;color:var(--muted);font-size:13px;max-width:900px}
.inbox-stat{display:inline-flex;gap:7px;align-items:center;padding:6px 10px;border-radius:8px;background:var(--accentbg);color:var(--accent);font-size:12px;font-weight:740;margin-top:12px}
.inbox-toolbar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin:16px 0 14px}
.inbox-toolbar select{min-height:35px;padding:7px;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:8px}
.inbox-switch{display:inline-flex;border:1px solid var(--line);padding:3px;background:var(--panel);border-radius:9px;gap:3px}
.inbox-switch button{background:transparent;border:0;color:var(--muted);border-radius:6px;padding:8px 10px;font-weight:650}
.inbox-switch button.on{background:var(--accent);color:#fff}
.inbox-item{background:var(--panel);border:1px solid var(--line);border-radius:11px;margin-bottom:10px;padding:14px 16px}
.inbox-item.selected{border-color:var(--accent);box-shadow:0 0 0 1px var(--accentbg)}
.inbox-top{display:flex;gap:11px;align-items:start}.inbox-top input{margin-top:6px;width:18px;height:18px;flex:none}
.inbox-title{font-size:15px;font-weight:730;margin:0 0 4px;overflow-wrap:anywhere}
.inbox-source{font-size:11px;color:var(--muted);overflow-wrap:anywhere}
.inbox-fields{display:grid;grid-template-columns:minmax(130px,1.4fr) minmax(110px,1fr) 90px 92px 92px 142px;gap:9px;margin:13px 0 9px}
.inbox-fields .field{gap:3px}.inbox-fields label{font-size:11px}.inbox-fields select,.inbox-fields input{width:100%;min-width:0;padding:7px;border-radius:7px;border:1px solid var(--line);background:var(--panel);color:var(--text);height:35px}
.inbox-footer{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;border-top:1px solid var(--line);padding-top:10px}
.inbox-import{border:1px dashed var(--line);border-radius:11px;background:var(--panel2);padding:15px;margin-bottom:18px}
.inbox-import summary{cursor:pointer;font-weight:740}.inbox-import .row{margin-top:12px}
.inbox-badge{background:var(--accent);color:#fff;font-weight:800;border-radius:99px;padding:1px 7px;min-width:20px;text-align:center;font-size:11px;margin-left:auto}
.inbox-checkall{font-size:12px;font-weight:630;display:flex;align-items:center;gap:6px}
.inbox-smallpanel{border:1px solid var(--line);border-radius:10px;padding:13px;background:var(--panel);margin-top:13px}
@media(max-width:850px){.inbox-fields{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:550px){.inbox-fields{grid-template-columns:repeat(2,minmax(0,1fr))}.inbox-top{gap:8px}.inbox-item{padding:12px}.inbox-toolbar .btn{white-space:normal}.inbox-switch{width:100%}.inbox-switch button{flex:1}}

function avgProgress(items){const valid=items.filter(x=>x.value!==null&&x.value!==undefined&&isNum(x.value)&&isNum(x.weight)&&x.weight>0);if(!valid.length)return {value:null,known:0,total:items.length}; const n=valid.reduce((a,x)=>a+x.value*x.weight,0),den=valid.reduce((a,x)=>a+x.weight,0);return {value:valid.length===items.length?Math.round(n/den):null,partial:Math.round(n/den),known:valid.length,total:items.length};}
function taskProgress(task,seen=new Set()){
 if(task.status==='done')return 100;
 if(task.progress!==null)return task.progress;
 if(seen.has(task.id))return null;
 seen.add(task.id);
 const kids=state.tasks.filter(t=>!t.archived&&t.parentId===task.id);
 if(!kids.length)return null;
 return avgProgress(kids.map(t=>({value:taskProgress(t,new Set(seen)),weight:t.weight||1}))).value;
}
function projectProgress(p){
 if(p.progressMode==='manual')return {value:p.progress,known:p.progress===null?0:1,total:1};
 const roots=state.tasks.filter(t=>!t.archived&&t.projectId===p.id&&(!t.parentId||!findT(t.parentId)));
 return avgProgress(roots.map(t=>({value:taskProgress(t),weight:t.weight||1})));
}

function priorityHtml(p){return `<span class="tag ${h((p||'P4').toLowerCase())}">${h(p)}</span>`;}

const pOpts=v=>selOpts(PRIORITIES.map(p=>[p,p]),v);
const statusOpts=v=>selOpts(Object.entries(STATUS),v);

const areaOf=p=>AREAS.includes(p?.area)?p.area:(SEED_AREAS[p?.id]||'Privat');
const areaOpts=(selected,all=false)=>selOpts([...(all?[['','Alle Bereiche']]:[]),...AREAS.map(a=>[a,a])],selected);
const dayDiff=(d)=>!d?null:Math.floor((new Date(ymd()+'T12:00:00')-new Date(d+'T12:00:00'))/86400000);

let embedded;

try {const stored=localStorage.getItem(KEY);if(stored){let obj=JSON.parse(stored);validateData(obj);initial=obj;}localStorage.setItem(KEY,JSON.stringify(initial));}catch(e){storageOk=false;console.warn('Lokaler Speicher:',e);}

if(!AREAS.includes(state.settings.focusArea)){state.settings.focusArea='Arbeit';needsMigration=true;}
const ui={tab:(Array.isArray(state.suggestions)&&state.suggestions.some(x=>x.status==='pending')?'inbox':'focus'),inboxSort:'due',inboxGrouped:true,inboxArea:'',inboxShow:'pending',inboxSelected:new Set(),skippedTasks:new Set(),lastCompleted:null,areaFilter:'',openProjects:new Set(['prj-soft-integration']),query:'',projectFilter:'',statusFilter:'',priorityFilter:'',hideDone:false,sortKey:'priority',sortDir:1,kanbanProject:'',calendarMonth:new Date().getMonth(),calendarYear:new Date().getFullYear(),timelineProject:'',importPreview:null};
ui.hideDone=!!state.settings.hideCompleted;

function saveIndicator(){const el=document.getElementById('saveIndicator');if(el)el.textContent=storageOk?'Automatisch lokal gespeichert':'Lokale Speicherung nicht verfügbar. JSON/HTML sichern!';}
function mutate(label,fn){fn();state.revision=(state.revision||0)+1;state.history.unshift({id:uid('h'),at:ts(),revision:state.revision,label});state.history=state.history.slice(0,700);persist();render();toast('Änderung gespeichert');}
let toastTimeout;
function toast(message){let el=document.getElementById('toast');el.textContent=message;el.classList.add('visible');clearTimeout(toastTimeout);toastTimeout=setTimeout(()=>el.classList.remove('visible'),3100);}
function closeMobileNav(){const menu=document.getElementById('mobileNavMore');if(menu)menu.hidden=true;const toggle=document.getElementById('mobileMoreToggle');if(toggle)toggle.setAttribute('aria-expanded','false');}

function focusCandidates(area){
 const available=activeT().filter(t=>t.status!=='done'&&t.status!=='blocked'&&(area==='Alle'||areaOf(findP(t.projectId))===area));
 const ids=new Set(available.map(t=>t.id));
 return available.filter(t=>!state.tasks.some(k=>!k.archived&&k.parentId===t.id&&k.status!=='done'))
 .sort((a,b)=>PRIORITIES.indexOf(a.priority)-PRIORITIES.indexOf(b.priority)
   ||(a.due||'9999-12-31').localeCompare(b.due||'9999-12-31')
   ||(['in_progress','review','open'].indexOf(a.status)-['in_progress','review','open'].indexOf(b.status))
   ||a.createdAt.localeCompare(b.createdAt)||a.id.localeCompare(b.id));
}

 return `<div class="focus-shell">${pendingSuggestions().length?`<div class="notice" style="margin-bottom:16px"><strong>${pendingSuggestions().length} neue To-do-Vorschläge</strong> warten auf Prüfung. <button class="btn sm" data-action="tab" data-tab="inbox">Jetzt verifizieren</button></div>`:''}<header class="focus-head"><div><div class="focus-kicker">DEIN ARBEITSMODUS</div><h2>Eine Aufgabe nach der anderen.</h2><p>Bereich wählen, erledigen oder überspringen. Planung und Details liegen in den übrigen Reitern.</p></div></header>

 </div>`;
}

function renderKanban(){const tsks=activeT().filter(t=>(!ui.kanbanProject||t.projectId===ui.kanbanProject)&&(!ui.hideDone||t.status!=='done'));return titleBar('Kanban','Aufgaben zwischen fünf Statusspalten verschieben')+`<div class="toolbar"><select data-filter="kanbanProject"><option value="">Alle Projekte</option>${projectOpts(ui.kanbanProject)}</select><label class="small row"><input type="checkbox" data-filter="hideDone" ${ui.hideDone?'checked':''}> Erledigte ausblenden</label><span class="tiny">Drag-and-drop oder Statusauswahl verwenden.</span></div><div class="columns">${Object.entries(STATUS).map(([key,label])=>{const tasks=tsks.filter(t=>t.status===key).sort((a,b)=>a.priority.localeCompare(b.priority));return `<div class="kanbanCol" data-dropstatus="${key}"><div class="row between"><strong>${h(label)}</strong><span class="tag p4">${tasks.length}</span></div>${tasks.map(t=>`<div class="kbItem" draggable="true" data-taskdrag="${h(t.id)}"><div class="row between">${priorityHtml(t.priority)}<button class="btn ghost sm" title="Bearbeiten" data-action="editTask" data-id="${h(t.id)}">↗</button></div><div style="font-weight:680;margin:6px 0">${h(t.title)}</div><div class="tiny">${h(findP(t.projectId)?.title||'')}</div><div style="margin:8px 0">${progHtml(taskProgress(t))}</div><select class="quickstatus" data-quick="taskStatus" data-id="${h(t.id)}" aria-label="Status verschieben">${statusOpts(t.status)}</select></div>`).join('')}</div>`;}).join('')}</div>`;}
function eventList(){let ret=[];for(let t of activeT()){if(t.due)ret.push({date:t.due,title:t.title,project:findP(t.projectId)?.title||'',projectId:t.projectId,type:'task',id:t.id,status:t.status});}for(let p of activeP())for(let m of p.milestones){if(m.date)ret.push({date:m.date,title:m.title,project:p.title,projectId:p.id,type:'milestone',id:m.id,status:m.status});}return ret;}
function renderTimeline(){let all=eventList().filter(e=>!ui.timelineProject||e.projectId===ui.timelineProject);let sorted=all.sort((a,b)=>a.date.localeCompare(b.date));const month=ui.calendarMonth,year=ui.calendarYear,first=new Date(year,month,1).getDay(),offset=(first+6)%7,total=new Date(year,month+1,0).getDate();let days='';for(let cell=0;cell<Math.ceil((offset+total)/7)*7;cell++){let day=cell-offset+1,actual=new Date(year,month,day),date=[actual.getFullYear(),String(actual.getMonth()+1).padStart(2,'0'),String(actual.getDate()).padStart(2,'0')].join('-');let events=sorted.filter(e=>e.date===date);days+=`<div class="day ${actual.getMonth()!==month?'dim':''} ${date===ymd()?'today':''}"><div class="daynum">${actual.getDate()}</div>${events.slice(0,3).map(e=>`<div class="eventchip" title="${h(e.title)}">${h(e.title)}</div>`).join('')}${events.length>3?`<div class="tiny">+${events.length-3}</div>`:''}</div>`;}

function renderSync(){return titleBar('Verlauf & ChatGPT','Gezielte Änderungspakete austauschen, Konflikte vor Import prüfen')+`<div class="notice">Keine automatische ChatGPT-Verbindung: Der aktuelle Planner-Datenstand wird explizit kopiert oder exportiert. ChatGPT erzeugt daraus ein Änderungspaket, das du hier prüfst und übernimmst.</div><div class="subgrid section"><div><div class="sectionhead"><h3>1. Daten an ChatGPT übergeben</h3></div><div class="panel stack"><p class="small" style="margin:0">Kopiere den vollständigen Projektstand mit Bearbeitungsanweisung. Änderungen sollen nur ausdrücklich bezeichnete Felder betreffen und bestehende IDs beibehalten.</p><button class="btn primary" data-action="copyChat">Projektstand für ChatGPT kopieren</button><button class="btn" data-action="downloadChat">Projektstand als Textdatei herunterladen</button><div class="tiny">Aktuelle Revision: <strong>${state.revision}</strong> · ${state.projects.length} Projekte, ${state.tasks.length} Aufgaben.</div><textarea class="dataarea" id="chatOutput" aria-label="Projektstand für ChatGPT" placeholder="Kopierter Projektstand erscheint hier als Rückfalloption."></textarea></div><div class="sectionhead" style="margin-top:21px"><h3>2. Änderungsdatei importieren</h3></div><div class="panel stack"><p class="small" style="margin:0">JSON-Patch einfügen oder als Datei auswählen. Vor der Übernahme erscheint eine Vorschau mit Einzelauswahl und Konflikthinweisen.</p><textarea class="dataarea" id="patchInput" placeholder='{"format":"ProjektplannerPatch","schemaVersion":1,"baseRevision":0,"ops":[]}'></textarea><div class="row"><button class="btn primary" data-action="previewPatch">Änderungen prüfen</button><button class="btn" data-action="chooseFile">JSON-Datei auswählen</button><button class="btn" data-action="examplePatch">Beispiel einfügen</button></div></div></div><div><div class="sectionhead"><h3>Änderungsverlauf</h3><span class="tiny">${state.history.length} Einträge</span></div><div class="panel" style="max-height:900px;overflow-y:auto">${state.history.slice(0,90).map(x=>`<div class="minirow"><div class="tiny">${stamp(x.at)} · Revision ${x.revision}</div><div>${h(x.label)}</div></div>`).join('')}</div></div></div><div class="section panel help"><h3>Dokumentiertes JSON-Änderungsformat</h3><p class="small">Format: <code>ProjektplannerPatch</code>, <code>schemaVersion: 1</code>, <code>baseRevision</code> aus dem kopierten Stand, <code>ops</code> als Liste. Unterstützt <code>add</code>, <code>update</code>, <code>move</code>, <code>archive</code>, <code>delete</code>. Ziel: <code>entity: "project"</code> oder <code>"task"</code>. Beim Aktualisieren nur ausdrücklich zu ändernde Felder in <code>changes</code> aufführen. Optional <code>expectedUpdatedAt</code> oder <code>expected</code> (bisherige Feldwerte) für exakte Konfliktprüfung. Für <code>move</code> einer Aufgabe <code>targetProjectId</code> und optional <code>targetParentId</code> verwenden. Für <code>add</code> ein vollständiges <code>value</code>-Objekt mit Titel und bei Aufgaben <code>projectId</code> liefern; IDs werden bei Bedarf vergeben.</p><p class="small">Ist die Ausgangsrevision zwischenzeitlich verändert und fehlen Feldvergleichswerte, wird der Vorgang als möglicher Konflikt markiert und nicht vorausgewählt. Warnungen lassen sich bewusst einzeln übersteuern. Löschungen sind vor der Übernahme gesondert erkennbar.</p></div>`;}
function renderSettings(){const archived=state.projects.filter(p=>p.archived);return titleBar('Einstellungen & Datensicherung','Offlinedaten kontrollieren, sichern und wiederherstellen')+`<div class="subgrid"><div class="stack"><div class="panel stack"><h3 style="margin:0">Vollständige Datensicherung</h3><div class="row"><button class="btn primary" data-action="exportJson">↓ JSON-Backup</button><button class="btn" data-action="exportHtml">↓ Aktuellen Planner als HTML</button><button class="btn" data-action="chooseFile">↑ JSON importieren</button><button class="btn" data-action="exportCsv">↓ Aufgaben als CSV</button></div><div class="notice">Eine exportierte HTML-Datei enthält den aktuellen Datenstand und funktioniert unabhängig vom ursprünglichen Browser. Für regelmäßige Sicherungen zusätzlich JSON exportieren.</div><div class="tiny">Speicherung: ${storageOk?'lokaler Browserspeicher verfügbar':'nicht verlässlich verfügbar'} · Datenstand Revision ${state.revision}</div></div><div class="panel stack"><h3 style="margin:0">Darstellung</h3><div class="field"><label>Farbschema</label><select data-setting="theme">${selOpts([['light','Hell'],['dark','Dunkel']],state.settings.theme)}</select></div><div class="field"><label>Ansichtsdichte</label><select data-setting="density">${selOpts([['compact','Kompakt'],['normal','Normal']],state.settings.density)}</select></div><label class="row"><input type="checkbox" data-setting="hideCompleted" ${state.settings.hideCompleted?'checked':''}> Erledigte Aufgaben standardmäßig ausblenden</label></div><div class="panel"><h3 style="margin-top:0">Archivierte Projekte (${archived.length})</h3>${archived.length?archived.map(p=>`<div class="minirow row between"><span>${h(p.title)}</span><button class="btn sm" data-action="restoreProject" data-id="${h(p.id)}">Reaktivieren</button></div>`).join(''):'<div class="muted small">Noch keine archivierten Projekte.</div>'}</div></div><div class="stack"><div class="panel"><h3 style="margin-top:0">Wiederherstellungspunkte</h3><p class="muted small">Vor JSON-Importen und Patchübernahmen wird automatisch eine interne Sicherung angelegt. Für browserübergreifende Sicherheit bitte Dateien herunterladen.</p>${state.backups.length?state.backups.map(b=>`<div class="minirow"><div class="row between"><div><strong>${h(b.label)}</strong><div class="tiny">${stamp(b.at)} · Revision ${b.snapshot.revision}</div></div><button class="btn sm" data-action="restoreBackup" data-id="${h(b.id)}">Wiederherstellen</button></div></div>`).join(''):'<div class="empty">Noch keine internen Wiederherstellungspunkte.</div>'}</div><div class="panel help"><h3 style="margin-top:0">Kurzanleitung</h3><p><strong>Jetzt erledigen:</strong> Bereich Arbeit, Privat oder Verein wählen. Es erscheint immer nur die nächste bearbeitbare Aufgabe. Erledigen entfernt sie aus der Warteschlange; Überspringen setzt sie für die aktuelle Sitzung zurück. Über „Mehr zur Aufgabe“ gelangst du zur Bearbeitung oder zum Projekt.</p><p><strong>Bereiche:</strong> Jedem Projekt wird im Projekteditor ein Lebensbereich zugeordnet. In Projekt- und Aufgabenliste kann danach gefiltert werden.</p><p><strong>Projekte:</strong> Themenkarte aufklappen, Aufgaben bearbeiten, neue Unteraufgaben oder Meilensteine hinzufügen. Projektstatus und automatische/manuelle Fortschrittsanzeige im Projekt-Editor einstellen.</p><p><strong>Aufgaben:</strong> Filtern, sortieren und Status/Prozentwert direkt in der Tabelle ändern. Im Kanban zwischen Spalten bewegen.</p><p><strong>ChatGPT:</strong> Unter „Verlauf & ChatGPT“ Projektstand kopieren, gewünschte Änderungen im Chat beschreiben, JSON-Patch zurückkopieren, prüfen und übernehmen.</p><p><strong>Backup:</strong> JSON herunterladen oder die vollständige HTML mit eingebettetem Datenstand speichern. Lokale Speicherung kann bei <code>file://</code> je nach Browser und Dateipfad unterschiedlich funktionieren.</p><p><strong>Wichtig:</strong> Die Anwendung sendet selbst keine Daten an externe Server. Das Kopieren der Daten in einen Chat liegt in deiner Hand.</p></div></div></div>`;}
function assert(ok,msg){if(!ok)throw Error(msg);}
function checkObject(v,label){assert(v&&typeof v==='object'&&!Array.isArray(v),label+' muss ein Objekt sein.');}
function validateData(d){
 checkObject(d,'Datensatz');assert(d.format==='ProjektplannerData'&&d.schemaVersion===1,'Unbekanntes Datenformat oder Schema.');assert(typeof d.storageId==='string'&&/^[\w:.-]{3,120}$/.test(d.storageId),'Ungültige Datei-Identität.');assert(Array.isArray(d.projects)&&Array.isArray(d.tasks),'Projekte oder Aufgaben fehlen.');assert(d.projects.length<=5000&&d.tasks.length<=50000,'Zu viele Datensätze.');assert(Number.isSafeInteger(d.revision)&&d.revision>=0,'Ungültige Revision.');checkObject(d.settings,'Einstellungen');assert(['light','dark'].includes(d.settings.theme),'Ungültiges Farbschema.');assert(['normal','compact'].includes(d.settings.density),'Ungültige Ansichtsdichte.');assert(typeof d.settings.hideCompleted==='boolean','Ungültige Ausblendeeinstellung.');assert(d.settings.focusArea===undefined||AREAS.includes(d.settings.focusArea),'Ungültiger Fokusbereich.');assert(Array.isArray(d.history)&&Array.isArray(d.backups),'Verlauf oder Sicherungen fehlen.');if(d.suggestions!==undefined){assert(Array.isArray(d.suggestions)&&d.suggestions.length<=30000,'Vorschläge ungültig oder zu zahlreich.');for(const c of d.suggestions){checkObject(c,'Vorschlag');assert(typeof c.id==='string'&&c.id.length<150,'Ungültige Vorschlags-ID.');assert(typeof c.title==='string'&&c.title.length>0&&c.title.length<=300,'Ungültiger Vorschlagstitel.');assert(['pending','accepted','dismissed','snoozed'].includes(c.status),'Ungültiger Vorschlagsstatus.');assert(c.importance==null||Number.isInteger(c.importance)&&c.importance>=1&&c.importance<=5,'Ungültige Wichtigkeit.');assert(c.urgency==null||Number.isInteger(c.urgency)&&c.urgency>=1&&c.urgency<=5,'Ungültige Dringlichkeit.');assert(validDate(c.due||''),'Ungültiges Vorschlagsdatum.');assert(Array.isArray(c.sourceChats)&&c.sourceChats.length<=150,'Ungültige Quellenliste.');}}
 const ids=new Set(),pids=new Set();const idValid=v=>typeof v==='string'&&/^[\w:.-]{2,120}$/.test(v);const str=(v,label,max=30000)=>assert(typeof v==='string'&&v.length<=max,label+' ist kein gültiger Text.');
 for(const p of d.projects){checkObject(p,'Projekt');assert(idValid(p.id)&&!ids.has(p.id),'Ungültige/doppelte Projekt-ID.');ids.add(p.id);pids.add(p.id);str(p.title,'Projekttitel',300);assert(p.area===undefined||AREAS.includes(p.area),'Ungültiger Projektbereich.');assert(p.title.trim().length>0,'Projekttitel darf nicht leer sein.');for(let f of ['category','description','goals','nextStep','blockers','createdAt','updatedAt'])str(p[f],f);assert(PRIORITIES.includes(p.priority),'Ungültige Projektpriorität.');assert(p.status in STATUS,'Ungültiger Projektstatus.');assert(validProgress(p.progress),'Ungültiger Projektfortschritt.');assert(['auto','manual'].includes(p.progressMode),'Ungültiger Fortschrittsmodus.');assert(typeof p.archived==='boolean','Archivstatus fehlt.');assert(Array.isArray(p.chats)&&p.chats.length<500,'Chatliste ungültig.');p.chats.forEach(x=>str(x,'Chattitel',1000));assert(Array.isArray(p.milestones)&&p.milestones.length<=1000,'Meilensteine ungültig.');const mid=new Set();p.milestones.forEach(m=>{checkObject(m,'Meilenstein');assert(idValid(m.id)&&!mid.has(m.id),'Meilenstein-ID ungültig.');mid.add(m.id);str(m.title,'Meilensteintitel',300);assert(m.title.trim(),'Meilensteintitel fehlt.');assert(validDate(m.date),'Ungültiges Meilensteindatum.');assert(m.status in STATUS,'Meilensteinstatus ungültig.');});}
 let taskIndex=new Map();for(const t of d.tasks){checkObject(t,'Aufgabe');assert(idValid(t.id)&&!ids.has(t.id),'Ungültige/doppelte Aufgaben-ID.');ids.add(t.id);taskIndex.set(t.id,t);assert(pids.has(t.projectId),'Unbekannte Projekt-ID für Aufgabe.');assert(t.parentId===null||idValid(t.parentId),'Ungültige Eltern-ID.');str(t.title,'Aufgabentitel',300);assert(t.title.trim().length>0,'Aufgabentitel fehlt.');for(let f of ['description','notes','createdAt','updatedAt'])str(t[f],f);assert(PRIORITIES.includes(t.priority),'Ungültige Aufgabenpriorität.');assert(t.status in STATUS,'Ungültiger Aufgabenstatus.');assert(validProgress(t.progress),'Ungültiger Aufgabenfortschritt.');assert(validDate(t.due),'Ungültiges Fälligkeitsdatum.');assert(isNum(t.weight)&&t.weight>0&&t.weight<=1000,'Aufgabengewicht außerhalb 0–1000.');assert(typeof t.archived==='boolean','Aufgabenarchivstatus fehlt.');for(const field of ['importance','urgency'])assert(t[field]===undefined||t[field]===null||Number.isInteger(t[field])&&t[field]>=1&&t[field]<=5,'Ungültige '+field+'-Bewertung.');}
 for(const t of d.tasks){if(t.parentId!==null){const parent=taskIndex.get(t.parentId);assert(parent&&parent.projectId===t.projectId,'Unteraufgabe hat ungültiges Elternobjekt.');let s=new Set([t.id]),id=t.parentId;while(id!==null){assert(!s.has(id),'Zyklische Unteraufgabenstruktur.');s.add(id);id=taskIndex.get(id)?.parentId??null;}}}
 return true;
}

function defaultTask(input){let now=ts();return {id:input.id||uid('tsk'),projectId:input.projectId||'',parentId:input.parentId||null,title:input.title||'',description:input.description||'',notes:input.notes||'',priority:input.priority||'P3',status:input.status||'open',progress:input.progress??null,due:input.due||'',weight:input.weight??1,importance:input.importance??null,urgency:input.urgency??null,createdAt:now,updatedAt:now,archived:input.archived??false};}

function projectEditor(id){let p=id?findP(id):null;if(id&&!p)return toast('Projekt nicht gefunden');p=p||defaultProject({title:'',priority:'P3',area:state.settings.focusArea});
 let body=`<input type="hidden" name="id" value="${h(id||'')}"><div class="formgrid"><div class="field wide"><label>Projektname *</label><input required name="title" maxlength="300" value="${h(p.title)}"></div><div class="field"><label>Kategorie</label><input name="category" value="${h(p.category)}"></div><div class="field"><label>Lebensbereich</label><select name="area">${areaOpts(areaOf(p))}</select></div><div class="field"><label>Priorität</label><select name="priority">${pOpts(p.priority)}</select></div><div class="field"><label>Status</label><select name="status">${statusOpts(p.status)}</select></div><div class="field"><label>Fortschrittsmodus</label><select name="progressMode" id="progressMode">${selOpts([['auto','Automatisch aus Aufgaben'],['manual','Manuell 0–100 %']],p.progressMode)}</select></div><div class="field wide" id="projectProgressField"><label>Manueller Fortschritt</label>${progressField(p.progress,p.progressMode==='auto')}<div class="tiny">Bei automatischem Modus werden nur Aufgaben mit bekannten Werten berücksichtigt.</div></div><div class="field wide"><label>Beschreibung</label><textarea name="description" rows="2">${h(p.description)}</textarea></div><div class="field wide"><label>Ziel / Ergebnis</label><textarea name="goals" rows="2">${h(p.goals)}</textarea></div><div class="field wide"><label>Nächster Schritt</label><textarea name="nextStep" rows="2">${h(p.nextStep)}</textarea></div><div class="field wide"><label>Blockaden / offene Fragen</label><textarea name="blockers" rows="2">${h(p.blockers)}</textarea></div><div class="field wide"><label>Originale Chat-Titel (je eine Zeile)</label><textarea name="chats" rows="4">${h(p.chats.join('\n'))}</textarea></div></div>`;

function parseImportText(text){assert(text&&text.length<=20000000,'Datei zu groß oder leer (max. 20 MB).');let obj=JSON.parse(text);if(obj.format==='ProjektplannerSuggestions'){importSuggestions(obj);return;}if(obj.format==='ProjektplannerData'){validateData(obj);previewFullImport(obj);}else if(obj.format==='ProjektplannerPatch'){previewPatch(obj);}else throw Error('Unbekanntes JSON-Format. Erwartet: ProjektplannerData oder ProjektplannerPatch.');}
function previewFullImport(obj){const body=`<div class="notice warn">Vollständiger JSON-Import ersetzt den aktuellen Projekt- und Aufgabenstand. Zuvor wird eine wiederherstellbare Sicherung angelegt.</div><div class="section"><p><strong>Neuer Datenstand:</strong> ${obj.projects.length} Projekte, ${obj.tasks.length} Aufgaben, Revision ${obj.revision}.</p><p><strong>Aktuell:</strong> ${state.projects.length} Projekte, ${state.tasks.length} Aufgaben, Revision ${state.revision}.</p><p class="small muted">Geänderte und fehlende Einträge werden nicht automatisch zusammengeführt. Für selektive Änderungen einen JSON-Patch verwenden.</p></div>`;ui.importPreview={kind:'full',data:deep(obj)};openModal('JSON-Datenstand importieren',body,`<button class="btn" type="button" data-action="closeModal">Abbrechen</button><button class="btn primary" type="button" data-action="applyFullImport">Mit Sicherung ersetzen</button>`);}
const PROJECT_FIELDS=['title','category','area','description','priority','status','progress','progressMode','chats','goals','nextStep','blockers','milestones','archived'];
const TASK_FIELDS=['title','description','priority','status','progress','due','weight','notes','archived','importance','urgency'];
function normalizeOp(op){checkObject(op,'Patch-Operation');assert(['add','update','move','archive','delete'].includes(op.op),'Nicht unterstützte Operation: '+op.op);assert(['project','task'].includes(op.entity),'Unbekannter Entitätstyp.');const result=deep(op);if(op.op==='move')assert(op.entity==='task','Nur Aufgaben können verschoben werden.');if(op.op==='add'){checkObject(op.value,'Neues Objekt');result.value.id=op.value.id||uid(op.entity==='project'?'prj':'tsk');}
 else {assert(typeof op.id==='string'&&op.id.length>1,'Ziel-ID fehlt.');}
 if(op.op==='update'){checkObject(op.changes,'Änderungsfelder');const permitted=op.entity==='project'?PROJECT_FIELDS:TASK_FIELDS;assert(Object.keys(op.changes).length>0,'Leere Änderung.');assert(Object.keys(op.changes).every(k=>permitted.includes(k)),'Nicht erlaubtes Änderungsfeld.');}
 if(op.op==='move'){assert(typeof op.targetProjectId==='string'&&op.targetProjectId,'Zielprojekt fehlt.');assert(op.targetParentId===undefined||op.targetParentId===null||typeof op.targetParentId==='string','Ungültige Elternaufgabe.');}
 return result;}
function patchConflict(op,current,d){if(op.op==='add')return null;let item=(op.entity==='project'?d.projects:d.tasks).find(x=>x.id===op.id);if(!item)return null;const expected=op.expected;
 if(expected!==undefined){checkObject(expected,'expected');const mismatches=Object.entries(expected).filter(([k,v])=>JSON.stringify(item[k])!==JSON.stringify(v)).map(([k])=>k);if(mismatches.length)return 'Abweichende bisherige Feldwerte: '+mismatches.join(', ');return null;}
 if(op.expectedUpdatedAt!==undefined){return op.expectedUpdatedAt===item.updatedAt?null:'Eintrag wurde seit dem exportierten Stand bearbeitet.';}
 return op.baseRevision!==undefined?null:null;
}
function applyOne(d,op){const list=op.entity==='project'?d.projects:d.tasks;let entry=op.op==='add'?null:list.find(x=>x.id===op.id);if(op.op!=='add')assert(entry,`Ziel nicht gefunden: ${op.id}`);
 if(op.op==='add'){const added=op.entity==='project'?defaultProject(op.value):defaultTask(op.value);assert(!d.projects.concat(d.tasks).some(x=>x.id===added.id),'ID bereits vorhanden: '+added.id);list.push(added);if(op.entity==='task'){let p=d.projects.find(p=>p.id===added.projectId);assert(p,'Zugehöriges Projekt fehlt.');p.updatedAt=ts();}return;}
 if(op.op==='update'){Object.assign(entry,op.changes,{updatedAt:ts()});if(op.entity==='task'){let p=d.projects.find(p=>p.id===entry.projectId);if(p)p.updatedAt=ts();}return;}
 if(op.op==='archive'){entry.archived=true;entry.updatedAt=ts();return;}
 if(op.op==='delete'){if(op.entity==='project'){d.projects=d.projects.filter(p=>p.id!==op.id);d.tasks=d.tasks.filter(t=>t.projectId!==op.id);}else{let ids=new Set([op.id]);let changed=true;while(changed){changed=false;for(let t of d.tasks)if(t.parentId&&ids.has(t.parentId)&&!ids.has(t.id)){ids.add(t.id);changed=true;}}d.tasks=d.tasks.filter(t=>!ids.has(t.id));}return;}
 if(op.op==='move'){let oldProject=entry.projectId,targets=new Set([entry.id]);let updated=true;while(updated){updated=false;for(let t of d.tasks)if(t.parentId&&targets.has(t.parentId)&&!targets.has(t.id)){targets.add(t.id);updated=true;}}for(let t of d.tasks)if(targets.has(t.id)){t.projectId=op.targetProjectId;t.updatedAt=ts();}entry.parentId=op.targetParentId??null;let old=d.projects.find(p=>p.id===oldProject),next=d.projects.find(p=>p.id===op.targetProjectId);if(old)old.updatedAt=ts();if(next)next.updatedAt=ts();return;}}
function summarizeOp(op){const action={add:'Hinzufügen',update:'Ändern',move:'Verschieben',archive:'Archivieren',delete:'Löschen'}[op.op];return `${action} · ${op.entity==='project'?'Projekt':'Aufgabe'} · ${op.op==='add'?op.value?.title||op.value?.id:op.id}${op.op==='update'?' · '+Object.keys(op.changes).join(', '):''}`;}
function analyzePatch(obj){checkObject(obj,'Patch');assert(obj.format==='ProjektplannerPatch'&&obj.schemaVersion===1,'Unbekanntes Patch-Format.');assert(Number.isSafeInteger(obj.baseRevision)&&obj.baseRevision>=0,'baseRevision muss eine nichtnegative ganze Zahl sein.');assert(Array.isArray(obj.ops)&&obj.ops.length>0&&obj.ops.length<=1000,'Patch muss 1 bis 1000 Operationen enthalten.');let working=deep(state);let items=[];
 for(let i=0;i<obj.ops.length;i++){let raw=obj.ops[i];try{let op=normalizeOp(raw);let item=(op.entity==='project'?working.projects:working.tasks).find(x=>x.id===op.id);let conflict=patchConflict(op,item,working);if(obj.baseRevision!==state.revision&&!conflict&&op.op!=='add'&&raw.expected===undefined&&raw.expectedUpdatedAt===undefined)conflict=`Ausgangsrevision ${obj.baseRevision} ≠ aktuelle Revision ${state.revision}; kein Feldvergleich angegeben.`;
 let test=deep(working);applyOne(test,op);validateData(test);items.push({index:i,op,conflict,error:null,checked:!conflict});if(!conflict)working=test;
 }catch(e){items.push({index:i,op:raw,conflict:null,error:e.message,checked:false});}}
 return items;
}
function previewPatch(obj){let items=analyzePatch(obj);ui.importPreview={kind:'patch',items,baseRevision:obj.baseRevision};const issues=items.filter(x=>x.error||x.conflict).length;const body=`<div class="notice ${issues?'warn':''}">Ausgangsrevision ${obj.baseRevision}, aktueller Stand ${state.revision}. ${items.length} Änderungen, davon ${issues} mit Fehlern oder Konflikthinweis. Jede Änderung ist einzeln auswählbar.</div><div class="stack" style="margin-top:14px">${items.map((it,i)=>`<label class="checkline patchItem ${it.error?'invalid':it.conflict?'conflict':''}"><input class="patchcheck" type="checkbox" data-patch-index="${i}" ${it.checked?'checked':''} ${it.error?'disabled':''}><div class="wraptext"><strong>${h(summarizeOp(it.op))}</strong>${it.conflict?`<div class="small" style="color:var(--amber)">Konflikt: ${h(it.conflict)}. Bewusste Übernahme möglich.</div>`:''}${it.error?`<div class="small dangertext">Ungültig: ${h(it.error)}</div>`:''}<details><summary class="tiny" style="cursor:pointer">JSON-Details</summary><pre style="white-space:pre-wrap;font-size:11px">${h(JSON.stringify(it.op,null,2))}</pre></details></div></label>`).join('')}</div>`;
 openModal('Patch überprüfen',body,`<span class="tiny" style="margin-right:auto">${items.length} Operationen · Auswahl prüfen</span><button type="button" class="btn" data-action="closeModal">Abbrechen</button><button type="button" class="btn primary" data-action="applyPatch">Ausgewählte übernehmen</button>`);
}

}
function scanChatFile(txt,name){let obj;try{obj=JSON.parse(txt);}catch(e){if(name.toLowerCase().endsWith('.txt'))return scanPlainText(txt,name);throw Error('Ungültiges JSON. Bitte conversations.json aus dem ZIP-Export entpacken.');}
 if(Array.isArray(obj))return scanConversations(obj,name);
 if(obj?.format==='ProjektplannerSuggestions')return importSuggestions(obj);
 if(Array.isArray(obj?.conversations))return scanConversations(obj.conversations,name);
 if(typeof obj?.title==='string'&&obj.mapping)return scanConversations([obj],name);
 throw Error('Dateityp nicht erkannt. Erwartet ChatGPT conversations.json oder ProjektplannerSuggestions.');
}
function scanPlainText(txt,name='Eingefügter Text'){
 assert(txt.length<=2000000,'Text zu lang (maximal 2 MB).');
 const lines=extractActionLines(txt);const items=lines.map(title=>({title,projectId:projectGuess(title,name),sourceChats:[name],evidence:txt.slice(0,300),source:'Eingefügter Text; Zeitraum nicht überprüfbar'}));
 const r=mergeProposalList(items,'Textscan');mutate('Eingefügten Text ausgewertet',()=>{state.scanMeta={lastScan:ts(),source:name,messages:1,added:r.added};});toast(`${r.added} mögliche To-dos aus Text erfasst`);
}
function scanTextInput(){const txt=document.getElementById('inboxSourceText')?.value.trim();try{assert(txt,'Bitte zuerst Text oder Chat-Export einfügen.');if(txt.startsWith('[')||txt.startsWith('{'))return scanChatFile(txt,'Eingefügter Chat-Export');scanPlainText(txt);}catch(e){alert('Scan nicht möglich: '+e.message);}}
function scanInstruction(){return `AUFTRAG: Prüfe ausschließlich die beigefügten ChatGPT-Chats der letzten 30 Tage (bezogen auf den Zeitpunkt der Auswertung). Extrahiere konkrete, künftig noch zu erledigende To-dos; bereits erledigte Punkte nicht neu anlegen. Verknüpfe thematisch gleiche Chats in gemeinsamen Vorschlägen. Ermittle nur wenn belegt: projectId, area (Arbeit/Privat/Verein), priority (P0–P4), importance und urgency (jeweils 1–5), due (YYYY-MM-DD). Unbekannte Werte leer/null lassen, nichts erfinden. Gib ausschließlich gültiges JSON zurück: {"format":"ProjektplannerSuggestions","schemaVersion":1,"items":[{"title":"...","description":"...","projectId":"...","area":"","priority":"","importance":null,"urgency":null,"due":"","sourceChats":["genauer Chat-Titel"],"sourceDates":[],"evidence":"kurzer belegender Satz"}]}. Bereits vorhandene Aufgaben nicht doppelt anlegen. Grundlage (bestehende Projekte und Aufgaben):\n${JSON.stringify({projects:state.projects.map(p=>({id:p.id,title:p.title,area:p.area,priority:p.priority,chats:p.chats})),tasks:state.tasks.map(t=>({title:t.title,projectId:t.projectId,status:t.status})),previouslyReviewed:state.suggestions.map(s=>({title:s.title,projectId:s.projectId,status:s.status}))})}`;}
async function copyScanPrompt(){const txt=scanInstruction();try{await navigator.clipboard.writeText(txt);toast('Scanauftrag kopiert. ChatGPT-Export separat beifügen.');}catch(e){downloadText(txt,'ChatGPT_30_Tage_Scanauftrag.txt');toast('Scanauftrag als Datei heruntergeladen');}}

function act(name,el){let id=el.dataset.id;switch(name){
 case 'tab':switchTab(el.dataset.tab);break;
 case 'inboxSort':ui.inboxSort=el.dataset.sort;render();break;
 case 'inboxToggleGroup':ui.inboxGrouped=!ui.inboxGrouped;render();break;
 case 'inboxPickAll':{const shown=shownSuggestions();const all=shown.every(x=>ui.inboxSelected.has(x.id));shown.forEach(x=>all?ui.inboxSelected.delete(x.id):ui.inboxSelected.add(x.id));render();break;}
 case 'inboxAccept':acceptSuggestions([id]);break;
 case 'inboxAcceptSelected':acceptSuggestions([...ui.inboxSelected]);break;
 case 'inboxSnooze':updateSuggestionStatus(id,'snoozed');break;
 case 'inboxDismiss':updateSuggestionStatus(id,'dismissed');break;
 case 'inboxRestore':updateSuggestionStatus(id,'pending');break;
 case 'inboxChooseChatFile':document.getElementById('chatFileInput').click();break;
 case 'inboxScanText':scanTextInput();break;
 case 'inboxImportJson':importSuggestionsFromText();break;
 case 'inboxCopyPrompt':copyScanPrompt();break;
  case 'toggleMobileMenu':{const menu=document.getElementById('mobileNavMore');menu.hidden=!menu.hidden;document.getElementById('mobileMoreToggle').setAttribute('aria-expanded',String(!menu.hidden));break;}
 case 'focusArea':if(!AREAS.includes(el.dataset.area))return;ui.skippedTasks.clear();mutate('Arbeitsbereich gewählt: '+el.dataset.area,()=>{state.settings.focusArea=el.dataset.area;});break;
  case 'focusSkip':if(findT(id))ui.skippedTasks.add(id);render();break;
  case 'focusReset':ui.skippedTasks.clear();render();break;
  case 'focusDone':{const t=findT(id);if(!t||t.status==='done')return;ui.skippedTasks.delete(id);mutate('Im Fokus erledigt: '+t.title,()=>{t.status='done';t.progress=100;t.updatedAt=ts();const p=findP(t.projectId);if(p)p.updatedAt=ts();});break;}
  case 'focusBlock':{const t=findT(id);if(!t)return;ui.skippedTasks.delete(id);mutate('Im Fokus blockiert: '+t.title,()=>{t.status='blocked';t.updatedAt=ts();const p=findP(t.projectId);if(p)p.updatedAt=ts();});break;}
 case 'gotoProject':ui.openProjects.add(id);switchTab('projects');setTimeout(()=>document.querySelector(`[data-action="toggleProject"][data-id="${CSS.escape(id)}"]`)?.scrollIntoView({block:'center',behavior:'smooth'}),20);break;
 case 'newProject':projectEditor();break;
 case 'editProject':projectEditor(id);break;
 case 'toggleProject':if(ui.openProjects.has(id))ui.openProjects.delete(id);else ui.openProjects.add(id);render();break;
 case 'newTask':taskEditor(null);break;
 case 'newTaskProject':taskEditor(null,{projectId:id});break;
 case 'newSubtask':{let t=findT(id);if(t)taskEditor(null,{projectId:t.projectId,parentId:id});break;}
 case 'editTask':taskEditor(id);break;
 case 'duplicateTask':duplicateTask(id);break;
 case 'deleteTask':deleteTask(id);break;
 case 'deleteProject':deleteProject(id);break;
 case 'archiveProject':{let p=findP(id);if(!p)return;mutate((p.archived?'Reaktiviert: ':'Archiviert: ')+p.title,()=>{p.archived=!p.archived;p.updatedAt=ts();});closeModal();break;}
 case 'restoreProject':{let p=findP(id);if(p)mutate('Projekt reaktiviert: '+p.title,()=>{p.archived=false;p.updatedAt=ts();});break;}
 case 'newMilestone':milestoneEditor(id);break;
 case 'editMilestone':milestoneEditor(id,el.dataset.mid);break;
 case 'deleteMilestone':{let p=findP(id),m=p?.milestones.find(x=>x.id===el.dataset.mid);if(!m)return;if(!confirm('Meilenstein „'+m.title+'“ löschen?'))return;mutate('Meilenstein gelöscht: '+m.title,()=>{p.milestones=p.milestones.filter(x=>x.id!==m.id);p.updatedAt=ts();});closeModal();break;}
 case 'closeModal':closeModal();break;
 case 'sort':{let key=el.dataset.key;if(ui.sortKey===key)ui.sortDir*=-1;else{ui.sortKey=key;ui.sortDir=1;}render();break;}
 case 'monthPrev':ui.calendarMonth--;if(ui.calendarMonth<0){ui.calendarMonth=11;ui.calendarYear--;}render();break;
 case 'monthNext':ui.calendarMonth++;if(ui.calendarMonth>11){ui.calendarMonth=0;ui.calendarYear++;}render();break;
 case 'monthToday':ui.calendarMonth=new Date().getMonth();ui.calendarYear=new Date().getFullYear();render();break;
 case 'exportJson':exportJson();break;
 case 'exportHtml':exportHtml();break;
 case 'exportCsv':exportCsv();break;
 case 'chooseFile':document.getElementById('fileInput').click();break;
 case 'copyChat':copyChat();break;
 case 'downloadChat':downloadText(chatPrompt(),filename('Projektplanner_ChatGPT_Stand','txt'));break;
 case 'examplePatch':examplePatch();break;
 case 'previewPatch':try{parseImportText(document.getElementById('patchInput').value);}catch(err){alert('Import nicht möglich: '+err.message);}break;
 case 'applyPatch':applySelectedPatch();break;
 case 'applyFullImport':applyFullImport();break;
 case 'restoreBackup':restoreBackup(id);break;
 }}
document.addEventListener('click',e=>{const a=e.target.closest('[data-action]');if(a){e.preventDefault();try{act(a.dataset.action,a);}catch(err){console.error(err);alert('Aktion fehlgeschlagen: '+err.message);}return;}if(e.target.id==='clearProgress'){const n=document.getElementById('progNumber'),s=document.getElementById('progSlider');if(n){n.value='';s.value=0;}return;}if(e.target.classList.contains('modalOverlay'))closeModal();});
document.addEventListener('input',e=>{const el=e.target;if(el.id==='progSlider'){const n=document.getElementById('progNumber');if(n)n.value=el.value;}else if(el.id==='progNumber'){const s=document.getElementById('progSlider');if(s&&el.value!=='')s.value=el.value;}else if(el.dataset.filter==='search'){
 let start=el.selectionStart,end=el.selectionEnd;ui.query=el.value;render();let replacement=document.querySelector('[data-filter="search"]');if(replacement){replacement.focus();replacement.setSelectionRange(start,end);} }
});
document.addEventListener('change',e=>{let el=e.target;try{if(el.dataset.inboxSelect){if(el.checked)ui.inboxSelected.add(el.dataset.id);else ui.inboxSelected.delete(el.dataset.id);document.querySelectorAll('[data-inbox-selectedcount]').forEach(n=>n.textContent=ui.inboxSelected.size);return;} 
 if(el.dataset.inboxField){editSuggestionField(el);return;}
 if(el.dataset.inboxFilter){ui[el.dataset.inboxFilter]=el.value;ui.inboxSelected.clear();render();return;}
 if(el.dataset.quick==='taskStatus'){const t=findT(el.dataset.id);if(t)mutate('Aufgabenstatus: '+t.title+' → '+STATUS[el.value],()=>{t.status=el.value;t.updatedAt=ts();findP(t.projectId).updatedAt=ts();});return;}
 if(el.dataset.quick==='taskProgress'){let t=findT(el.dataset.id);if(t){let n=parseProgress(el.value);mutate('Aufgabenfortschritt: '+t.title+' → '+pct(n),()=>{t.progress=n;t.updatedAt=ts();findP(t.projectId).updatedAt=ts();});}return;}
 if(el.dataset.filter){const map={area:'areaFilter',project:'projectFilter',status:'statusFilter',priority:'priorityFilter',kanbanProject:'kanbanProject',timelineProject:'timelineProject'};if(el.dataset.filter==='hideDone'){ui.hideDone=el.checked;mutate('Ausblendfilter geändert',()=>{state.settings.hideCompleted=el.checked;});}else{ui[map[el.dataset.filter]]=el.value;render();}return;}
 if(el.dataset.setting){let field=el.dataset.setting,val=el.type==='checkbox'?el.checked:el.value;mutate('Darstellung geändert: '+field,()=>{state.settings[field]=val;});return;}
 if(el.id==='taskProjectSelect'){let id=document.querySelector('#taskForm [name=id]')?.value||'';refreshTaskParent(el.value,id,'');return;}
 if(el.id==='progressMode'){let disabled=el.value==='auto';document.querySelectorAll('#projectProgressField input,#projectProgressField button').forEach(x=>x.disabled=disabled);return;}
 }catch(err){alert('Wert konnte nicht gespeichert werden: '+err.message);render();}});
document.addEventListener('submit',e=>{const formName=e.target.getAttribute('id');if(!['projectForm','taskForm','milestoneForm'].includes(formName))return;e.preventDefault();try{if(formName==='projectForm')saveProject(e.target);else if(formName==='taskForm')saveTask(e.target);else saveMilestone(e.target);}catch(err){alert('Bitte Angaben prüfen: '+err.message);}});
document.addEventListener('dragstart',e=>{const card=e.target.closest('[data-taskdrag]');if(!card)return;e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',card.dataset.taskdrag);});
document.addEventListener('dragover',e=>{const target=e.target.closest('[data-dropstatus]');if(target){e.preventDefault();e.dataTransfer.dropEffect='move';target.classList.add('dragover');}});
document.addEventListener('dragleave',e=>{const target=e.target.closest('[data-dropstatus]');if(target&&!target.contains(e.relatedTarget))target.classList.remove('dragover');});
document.addEventListener('drop',e=>{const target=e.target.closest('[data-dropstatus]');if(!target)return;e.preventDefault();let id=e.dataTransfer.getData('text/plain'),t=findT(id),status=target.dataset.dropstatus;if(t&&status in STATUS&&t.status!==status)mutate('Kanban: '+t.title+' → '+STATUS[status],()=>{t.status=status;t.updatedAt=ts();findP(t.projectId).updatedAt=ts();});else render();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeMobileNav();if(document.querySelector('.modalOverlay'))closeModal();}});
document.addEventListener('click',e=>{const menu=document.getElementById('mobileNavMore');if(menu&&!menu.hidden&&!e.target.closest('#mobileNavMore,#mobileMoreToggle'))closeMobileNav();});
document.getElementById('fileInput').addEventListener('change',async e=>{let file=e.target.files[0];if(!file)return;try{assert(file.size<=20000000,'Maximal 20 MB zulässig.');parseImportText(await file.text());}catch(err){alert('JSON-Datei nicht importiert: '+err.message);}finally{e.target.value='';}});
document.getElementById('chatFileInput').addEventListener('change',async e=>{const file=e.target.files?.[0];if(!file)return;try{assert(file.size<=100000000,'Chat-Export zu groß (max. 100 MB).');const txt=await file.text();scanChatFile(txt,file.name);}catch(err){alert('Chat-Import fehlgeschlagen: '+err.message);}finally{e.target.value='';}});
window.addEventListener('storage',e=>{if(e.key!==KEY||!e.newValue)return;try{const incoming=JSON.parse(e.newValue);validateData(incoming);if(incoming.revision>state.revision){state=incoming;render();toast('Neueren Datenstand aus anderem Tab übernommen');}}catch(err){console.warn('Ungültiges fremdes Update',err);}});
render();
if('serviceWorker' in navigator && (location.protocol==='https:' || location.hostname==='localhost' || location.hostname==='127.0.0.1')){
 window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js',{scope:'./'}).catch(err=>console.warn('Offline-Cache nicht verfügbar:',err)));
}
</script>
</body></html>
